name: update formula

# Keeps Formula/pomo.rb pointing at the newest pixel-pomodoro release.
#
# It runs here rather than being pushed from the pixel-pomodoro release job on
# purpose: a cross-repo push would need a personal access token kept as a
# secret, while this only ever writes to its own repo and so can use the
# built-in GITHUB_TOKEN. The cost is up to an hour of lag after a release,
# which `workflow_dispatch` covers when that matters.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO: muhalifalgibran/pixel-pomodoro

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Regenerate the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # /releases/latest skips prereleases, which is what pomo --update
          # follows too, so brew and the self-updater never disagree.
          tag=$(gh release view --repo "$REPO" --json tagName -q .tagName)
          version=${tag#v}
          echo "latest release is $tag"

          if grep -q "version \"$version\"" Formula/pomo.rb 2>/dev/null; then
            echo "formula is already on $version"
            exit 0
          fi

          gh release download "$tag" --repo "$REPO" --pattern checksums.txt --output checksums.txt --clobber

          # checksums.txt lines look like: <sha256>  ./pomo_v1.2.3_darwin_arm64.tar.gz
          sha() {
            local want="pomo_${tag}_$1.tar.gz"
            local found
            found=$(awk -v f="$want" '$2 ~ f {print $1}' checksums.txt)
            if [ -z "$found" ]; then
              echo "no checksum for $want" >&2
              exit 1
            fi
            printf '%s' "$found"
          }
          url() { printf 'https://github.com/%s/releases/download/%s/pomo_%s_%s.tar.gz' "$REPO" "$tag" "$tag" "$1"; }

          cat > Formula/pomo.rb <<EOF
          # Generated by .github/workflows/update-formula.yml — edit that, not this.
          class Pomo < Formula
            desc "Habit tracker for the terminal, driven by a pixel-art pomodoro timer"
            homepage "https://github.com/$REPO"
            version "$version"
            license "MIT"

            on_macos do
              on_arm do
                url "$(url darwin_arm64)"
                sha256 "$(sha darwin_arm64)"
              end
              on_intel do
                url "$(url darwin_amd64)"
                sha256 "$(sha darwin_amd64)"
              end
            end

            on_linux do
              on_arm do
                url "$(url linux_arm64)"
                sha256 "$(sha linux_arm64)"
              end
              on_intel do
                url "$(url linux_amd64)"
                sha256 "$(sha linux_amd64)"
              end
            end

            def install
              bin.install "pomo"
            end

            test do
              assert_match "pomo v#{version}", shell_output("#{bin}/pomo -version")
            end
          end
          EOF

          rm -f checksums.txt
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Commit if it changed
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/pomo.rb; then
            echo "nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/pomo.rb
          git commit -m "pomo ${TAG}"
          git push
